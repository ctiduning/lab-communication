<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTI华测检测 - 实验室沟通系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #005BAC 0%, #0072CE 50%, #00A0E9 100%);
      min-height: 100vh;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,208C960,213,1056,171,1152,149.3C1248,128,1344,128,1392,128L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
      background-size: cover;
    }

    .login-box {
      background: white;
      padding: 45px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #005BAC, #00A0E9);
    }

    .brand-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      font-size: 32px;
      font-weight: 700;
      color: #005BAC;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .brand-slogan {
      font-size: 14px;
      color: #666;
      letter-spacing: 3px;
    }

    .brand-desc {
      font-size: 13px;
      color: #999;
      margin-top: 8px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #eee;
      margin-bottom: 25px;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      border-radius: 6px;
      transition: all 0.3s;
      font-size: 15px;
    }

    .tab.active {
      background: white;
      color: #005BAC;
      box-shadow: 0 2px 8px rgba(0, 82, 156, 0.2);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
      font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #00A0E9;
      box-shadow: 0 0 0 3px rgba(0, 160, 233, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #005BAC 0%, #00A0E9 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 2px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 82, 156, 0.4);
    }

    .role-fields {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: none;
    }

    .role-fields.active {
      display: block;
    }

    .error { color: #e53e3e; font-size: 12px; margin-top: 8px; text-align: center; }
    .success { color: #2f855a; font-size: 12px; margin-top: 8px; text-align: center; }

    .main-layout { display: flex; min-height: 100vh; }
    
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #005BAC 0%, #003d6e 100%);
      color: white;
      padding: 25px 15px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 20px;
    }

    .menu-item {
      padding: 12px 15px;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 5px;
      transition: all 0.3s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(255,255,255,0.2);
    }

    .content {
      flex: 1;
      margin-left: 220px;
      padding: 25px;
      background: #f5f7fa;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: white;
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .btn-logout {
      padding: 10px 20px;
      background: #fff;
      color: #e53e3e;
      border: 2px solid #e53e3e;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-logout:hover {
      background: #e53e3e;
      color: white;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 18px; }
    .form-row.full { grid-template-columns: 1fr; }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      font-size: 14px;
      background: #f8f9fa;
    }

    .search-box input:focus {
      outline: none;
      border-color: #00A0E9;
      background: white;
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }

    .recipient-list {
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      max-height: 250px;
      overflow-y: auto;
      background: #fafafa;
    }

    .recipient-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .recipient-item:last-child { border-bottom: none; }
    .recipient-item:hover { background: #f0f7ff; }
    .recipient-item input { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; }
    .recipient-item .name { font-weight: 600; color: #333; }
    .recipient-item .dept { font-size: 12px; color: #888; margin-top: 3px; }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .table th, .table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .table th { background: #f8f9fa; font-weight: 600; color: #333; font-size: 14px; }
    .table tr:hover { background: #f8f9fa; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-paid { background: #fee2e2; color: #dc2626; }
    .badge-free { background: #dcfce7; color: #16a34a; }
    .badge-dispute { background: #fef3c7; color: #d97706; }
    .badge-follow { background: #d1fae5; color: #059669; }
    .badge-consult { background: #ede9fe; color: #7c3aed; }
    .badge-other { background: #f3f4f6; color: #4b5563; }

    .msg-item {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 4px solid #00A0E9;
    }

    .msg-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .msg-sender { font-weight: 600; color: #333; font-size: 15px; }
    .msg-time { color: #999; font-size: 12px; }
    .msg-content { color: #555; margin-bottom: 12px; line-height: 1.6; }
    .msg-meta { font-size: 12px; color: #666; padding: 8px 12px; background: #f8f9fa; border-radius: 6px; margin-bottom: 12px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.show { display: flex; }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      min-height: 120px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
      margin-left: 10px;
    }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 12px;
      width: auto;
      font-size: 13px;
    }

    .btn-small {
      padding: 6px 12px;
      width: auto;
      font-size: 13px;
    }

    .user-info {
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .user-info p {
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }

    .user-info strong {
      color: #333;
      display: inline-block;
      width: 70px;
    }

    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .admin-tab {
      padding: 10px 20px;
      background: white;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .admin-tab.active {
      background: #005BAC;
      color: white;
      border-color: #005BAC;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .stat-card .num {
      font-size: 32px;
      font-weight: 700;
      color: #005BAC;
    }

    .stat-card .label {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="pageLogin">
    <div class="login-wrap">
      <div class="login-box">
        <div class="brand-area">
          <div class="brand-logo">CTI华测检测</div>
          <div class="brand-slogan">为品质生活传递信任</div>
          <div class="brand-desc">实验室沟通系统</div>
        </div>

        <div class="tabs">
          <div class="tab active" onclick="showTab('login')">登录</div>
          <div class="tab" onclick="showTab('register')">注册</div>
        </div>

        <div id="formLogin">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="loginUser" placeholder="请输入用户名">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPass" placeholder="请输入密码">
          </div>
          <button class="btn" onclick="doLogin()">登 录</button>
          <div id="loginError" class="error"></div>
        </div>

        <div id="formRegister" style="display: none;">
          <div class="form-group">
            <label>用户角色</label>
            <select id="regRole" onchange="toggleRoleFields()">
              <option value="business">业务端</option>
              <option value="lab">实验室端</option>
            </select>
          </div>
          <div class="form-group">
            <label>姓名</label>
            <input type="text" id="regName" placeholder="请输入姓名">
          </div>
          <div class="form-group">
            <label>工号</label>
            <input type="text" id="regId" placeholder="请输入工号（唯一标识）">
          </div>
          <div class="form-group">
            <label>联系电话</label>
            <input type="tel" id="regPhone" placeholder="请输入联系电话">
          </div>
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="regEmail" placeholder="请输入邮箱">
          </div>

          <div id="fieldsBusiness" class="role-fields active">
            <div class="form-group">
              <label>所在地区</label>
              <input type="text" id="regRegion" placeholder="请输入所在地区">
            </div>
          </div>

          <div id="fieldsLab" class="role-fields">
            <div class="form-group">
              <label>所属部门</label>
              <input type="text" id="regDept" placeholder="请输入所属部门">
            </div>
            <div class="form-group">
              <label>联系优先级</label>
              <select id="regPriority">
                <option value="leader">组长</option>
                <option value="member">组员</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="regUser" placeholder="请设置用户名">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPass" placeholder="请设置密码">
          </div>
          <button class="btn" onclick="doRegister()">注 册</button>
          <div id="regError" class="error"></div>
          <div id="regSuccess" class="success"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="pageMain" style="display: none;">
    <div class="main-layout">
      <div class="sidebar">
        <div class="sidebar-brand">
          <h2>青岛华测实验室</h2>
          <p>沟通系统</p>
        </div>
        <div id="menuList"></div>
      </div>
      <div class="content">
        <div class="content-header">
          <h1 id="pageTitle">主动发起沟通</h1>
          <button class="btn-logout" onclick="doLogout()">退出登录</button>
        </div>
        <div id="pageContent"></div>
      </div>
    </div>
  </div>

  <div id="modalReply" class="modal-overlay">
    <div class="modal-content">
      <h3>回复消息</h3>
      <div id="replySender" class="user-info"></div>
      <div id="replyOriginal" style="margin-bottom: 15px;"></div>
      <textarea id="replyContent" placeholder="请输入回复内容..."></textarea>
      <button class="btn" onclick="sendReply()">发送回复</button>
      <button class="btn btn-secondary" onclick="closeReply()">取消</button>
    </div>
  </div>

  <div id="modalDelete" class="modal-overlay">
    <div class="modal-content">
      <h3>删除用户</h3>
      <p style="margin-bottom: 20px; color: #666;">确定要删除用户 <strong id="deleteUserName"></strong> 吗？此操作不可恢复！</p>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
      <button class="btn btn-secondary" onclick="closeDelete()">取消</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let replyTargetId = null;
    let deleteTargetId = null;

    function initData() {
      if (!localStorage.getItem('lab_users')) {
        localStorage.setItem('lab_users', JSON.stringify([
          { id: 1, username: 'admin', password: 'admin123', name: '管理员', role: 'admin', employeeId: '0000', phone: '13800138000', email: 'admin@lab.com' },
          { id: 2, username: 'business1', password: '123456', name: '张三', role: 'business', employeeId: 'B001', phone: '13800138001', email: 'zhang@business.com', region: '北京' },
          { id: 3, username: 'business2', password: '123456', name: '李四', role: 'business', employeeId: 'B002', phone: '13800138002', email: 'li@business.com', region: '上海' },
          { id: 4, username: 'business3', password: '123456', name: '王五', role: 'business', employeeId: 'B003', phone: '13800138003', email: 'wang@business.com', region: '广州' },
          { id: 5, username: 'lab1', password: '123456', name: '王组长', role: 'lab', employeeId: 'L001', phone: '13800138004', email: 'wang@lab.com', department: '理化检测组', priority: 'leader' },
          { id: 6, username: 'lab2', password: '123456', name: '陈组员', role: 'lab', employeeId: 'L002', phone: '13800138005', email: 'chen@lab.com', department: '理化检测组', priority: 'member' },
          { id: 7, username: 'lab3', password: '123456', name: '刘组长', role: 'lab', employeeId: 'L003', phone: '13800138006', email: 'liu@lab.com', department: '微生物检测组', priority: 'leader' },
          { id: 8, username: 'lab4', password: '123456', name: '张组员', role: 'lab', employeeId: 'L004', phone: '13800138007', email: 'zhang@lab.com', department: '微生物检测组', priority: 'member' },
          { id: 9, username: 'business4', password: '123456', name: '赵六', role: 'business', employeeId: 'B004', phone: '13800138008', email: 'zhao@business.com', region: '深圳' },
          { id: 10, username: 'business5', password: '123456', name: '张三', role: 'business', employeeId: 'B005', phone: '13800138009', email: 'zhangs@business.com', region: '杭州' },
        ]));
      }
      if (!localStorage.getItem('lab_messages')) {
        localStorage.setItem('lab_messages', JSON.stringify([]));
      }
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab')[tab === 'login' ? 0 : 1].classList.add('active');
      document.getElementById('formLogin').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('loginError').textContent = '';
      document.getElementById('regError').textContent = '';
      document.getElementById('regSuccess').textContent = '';
    }

    function toggleRoleFields() {
      const role = document.getElementById('regRole').value;
      document.getElementById('fieldsBusiness').classList.toggle('active', role === 'business');
      document.getElementById('fieldsLab').classList.toggle('active', role === 'lab');
    }

    function doLogin() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      if (!user || !pass) {
        document.getElementById('loginError').textContent = '请输入用户名和密码';
        return;
      }
      const users = JSON.parse(localStorage.getItem('lab_users') || '[]');
      const found = users.find(u => u.username === user && u.password === pass);
      if (found) {
        currentUser = found;
        localStorage.setItem('lab_current', JSON.stringify(found));
        showMain();
      } else {
        document.getElementById('loginError').textContent = '用户名或密码错误';
      }
    }

    function doRegister() {
      const role = document.getElementById('regRole').value;
      const name = document.getElementById('regName').value;
      const empId = document.getElementById('regId').value;
      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const user = document.getElementById('regUser').value;
      const pass = document.getElementById('regPass').value;

      if (!name || !empId || !user || !pass) {
        document.getElementById('regError').textContent = '请填写必要信息';
        return;
      }

      const users = JSON.parse(localStorage.getItem('lab_users') || '[]');
      if (users.find(u => u.username === user)) {
        document.getElementById('regError').textContent = '用户名已存在';
        return;
      }
      if (users.find(u => u.employeeId === empId)) {
        document.getElementById('regError').textContent = '工号已存在，请使用唯一工号';
        return;
      }

      const newUser = { id: Date.now(), username: user, password: pass, name, role, employeeId: empId, phone, email };
      if (role === 'business') {
        newUser.region = document.getElementById('regRegion').value || '-';
      } else {
        newUser.department = document.getElementById('regDept').value || '-';
        newUser.priority = document.getElementById('regPriority').value;
      }

      users.push(newUser);
      localStorage.setItem('lab_users', JSON.stringify(users));
      document.getElementById('regSuccess').textContent = '注册成功，请登录';
      document.getElementById('regError').textContent = '';
      setTimeout(() => showTab('login'), 2000);
    }

    function showMain() {
      document.getElementById('pageLogin').style.display = 'none';
      document.getElementById('pageMain').style.display = 'flex';
      renderMenu();
      if (currentUser.role === 'admin') showAdmin();
      else if (currentUser.role === 'business') showBusinessSend();
      else showLabSend();
    }

    function renderMenu() {
      const menu = document.getElementById('menuList');
      let html = '';
      if (currentUser.role === 'admin') {
        html = '<div class="menu-item active" onclick="showAdmin()">用户管理</div>';
      } else if (currentUser.role === 'business') {
        html = '<div class="menu-item active" onclick="showBusinessSend()">发起沟通</div><div class="menu-item" onclick="showBusinessReceive()">收到的消息</div>';
      } else {
        html = '<div class="menu-item active" onclick="showLabSend()">发起沟通</div><div class="menu-item" onclick="showLabReceive()">收到的消息</div>';
      }
      menu.innerHTML = html;
    }

    function showAdmin() {

    function exportData() {
      const data = {
        users: JSON.parse(localStorage.getItem('lab_users') || '[]'),
        exportTime: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

      a.href = url;
      a.download = `lab_users_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.json`;
      document.body.appendChild(a);

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (!importedData.users || !Array.isArray(importedData.users)) {
            alert('无效的数据文件格式');
            return;
          }

          const existingUsers = JSON.parse(localStorage.getItem('lab_users') || '[]');
          const existingEmpIds = new Set(existingUsers.map(u => u.employeeId));
          const existingUsernames = new Set(existingUsers.map(u => u.username));
          let importedCount = 0;

          importedData.users.forEach(user => {
            if (!existingEmpIds.has(user.employeeId) && !existingUsernames.has(user.username)) {
              existingUsers.push({
                ...user,
                id: Date.now() + Math.random() // 生成新ID避免冲突
              });
              importedCount++;
            }
          });

          localStorage.setItem('lab_users', JSON.stringify(existingUsers));
          alert(`成功导入 ${importedCount} 个用户！`);
          showAdmin();
        } catch (err) {
          alert('导入失败：' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function filterRecipients(type) {
      const searchInput = type === 'lab' ? document.getElementById('labSearch') : document.getElementById('bizSearch');
      const containerId = type === 'lab' ? 'bRecipients' : 'lRecipients';
      const searchText = searchInput.value.toLowerCase();
      const container = document.getElementById(containerId);
      const items = container.querySelectorAll('.recipient-item');

      items.forEach(item => {
        const name = item.getAttribute('data-name').toLowerCase();
        const dept = item.getAttribute('data-dept').toLowerCase();
        const empId = item.getAttribute('data-empid').toLowerCase();
        item.style.display = (name.includes(searchText) || dept.includes(searchText) || empId.includes(searchText)) ? 'flex' : 'none';
      });
    }

    function getUsersByRole(role) {
      return JSON.parse(localStorage.getItem('lab_users') || '[]').filter(u => u.role === role);

      return JSON.parse(localStorage.getItem('lab_users') || '[]').find(u => u.id === id);
    }

      const msgs = JSON.parse(localStorage.getItem('lab_messages') || '[]');
      return msgs.filter(m => m.senderId === currentUser.id && m.senderRole === role);

      return ids.map(id => {
        const user = getUserById(id);
        return user ? `${user.name} (${user.employeeId})` : '未知';
      }).join(', ');
    }

    function getTypeName(type) {
      const names = { paid_urgent: '付费加急', free_urgent: '免费加急', data_dispute: '数据质疑', follow_up: '跟单', consultation: '咨询', other: '其他', unqualified: '不合格沟通', data_confirm: '数据确认' };
      return names[type] || type;
    }

    function getBadgeType(type) {
      const types = { paid_urgent: 'paid', free_urgent: 'free', data_dispute: 'dispute', follow_up: 'follow', consultation: 'consult', other: 'other', unqualified: 'paid', data_confirm: 'free' };
      return types[type] || 'other';
    }

    function formatTime(time) {
      return time ? new Date(time).toLocaleString('zh-CN') : '-';
    }

    function sendBusinessMsg() {
      const recipients = [];
      document.querySelectorAll('#bRecipients input:checked').forEach(cb => recipients.push(parseInt(cb.value)));
      if (recipients.length === 0) {
        alert('请选择至少一个接收人');
        return;
      }

      const msg = {
        id: Date.now(),
        senderId: currentUser.id,
        senderRole: 'business',
        recipients,
        type: document.getElementById('bType').value,
        vip: document.getElementById('bVip').value,
        customerName: document.getElementById('bCustomer').value,
        sampleCode: document.getElementById('bSample').value,
        sampleMatrix: document.getElementById('bMatrix').value,
        sampleCount: document.getElementById('bCount').value,
        testItems: document.getElementById('bItems').value,
        sampleDate: document.getElementById('bDate').value,
        requestedCycle: document.getElementById('bCycle').value,
        chargeStatus: document.getElementById('bCharge').value,
        urgentFee: document.getElementById('bFee').value,
        remark: document.getElementById('bRemark').value,
        status: 'pending',
        replies: [],
        createdAt: new Date().toISOString()
      };

      const msgs = JSON.parse(localStorage.getItem('lab_messages') || '[]');
      msgs.push(msg);
      localStorage.setItem('lab_messages', JSON.stringify(msgs));
      alert('发送成功');
      showBusinessSend();
    }

    function sendLabMsg() {
      const recipients = [];
      document.querySelectorAll('#lRecipients input:checked').forEach(cb => recipients.push(parseInt(cb.value)));
      if (recipients.length === 0) {
        alert('请选择至少一个接收人');
        return;
      }

      const content = document.getElementById('lContent').value;
      if (!content.trim()) {
        alert('请输入沟通内容');
        return;
      }

      const msg = {
        id: Date.now(),
        senderId: currentUser.id,
        senderRole: 'lab',
        recipients,
        type: document.getElementById('lType').value,
        sampleCode: document.getElementById('lSample').value,
        content,
        status: 'pending',
        replies: [],
        createdAt: new Date().toISOString()
      };

      const msgs = JSON.parse(localStorage.getItem('lab_messages') || '[]');
      msgs.push(msg);
      localStorage.setItem('lab_messages', JSON.stringify(msgs));
      alert('发送成功');
      showLabSend();
    }

    function openReply(msgId) {
      replyTargetId = msgId;
      const msgs = JSON.parse(localStorage.getItem('lab_messages') || '[]');
      const msg = msgs.find(m => m.id === msgId);
      if (!msg) return;
      const sender = getUserById(msg.senderId);

      document.getElementById('replySender').innerHTML = `<p><strong>姓名:</strong> ${sender?.name || '未知'}</p><p><strong>工号:</strong> ${sender?.employeeId || '-'}</p><p><strong>电话:</strong> ${sender?.phone || '-'}</p><p><strong>邮箱:</strong> ${sender?.email || '-'}</p><p><strong>${sender?.region ? '地区' : '部门'}:</strong> ${sender?.region || sender?.department || '-'} ${sender?.priority ? '(' + (sender.priority === 'leader' ? '组长' : '组员') + ')' : ''}</p>`;
      document.getElementById('replyOriginal').innerHTML = `<strong style="display:block; margin-bottom:8px;">原消息：</strong><p style="padding:12px; background:#f8f9fa; border-radius:6px; color:#555;">${msg.content || '(表单沟通)'}</p>`;
      document.getElementById('replyContent').value = '';
      document.getElementById('modalReply').classList.add('show');
    }

    function closeReply() {
      document.getElementById('modalReply').classList.remove('show');
      replyTargetId = null;
    }

    function sendReply() {
      const content = document.getElementById('replyContent').value;
      if (!content.trim()) {
        alert('请输入回复内容');
        return;
      }

      const msgs = JSON.parse(localStorage.getItem('lab_messages') || '[]');
      const idx = msgs.findIndex(m => m.id === replyTargetId);
      if (idx === -1) return;

      msgs[idx].replies = msgs[idx].replies || [];
      msgs[idx].replies.push({ id: Date.now(), senderId: currentUser.id, content, createdAt: new Date().toISOString() });
      msgs[idx].status = 'replied';
      localStorage.setItem('lab_messages', JSON.stringify(msgs));
      closeReply();

      if (currentUser.role === 'business') showBusinessReceive();
      else showLabReceive();
    }

    function viewDetail(msgId) {
      const msgs = JSON.parse(localStorage.getItem('lab_messages') || '[]');
      const msg = msgs.find(m => m.id === msgId);
      if (!msg) return;
      const sender = getUserById(msg.senderId);
      const recipients = msg.recipients.map(id => getUserById(id)).filter(Boolean);

      let html = `<div class="card"><h3>沟通详情</h3><div style="margin-bottom:20px;"><p><strong>发送人：</strong>${sender?.name || '未知'} (${sender?.employeeId || '-'})</p><p><strong>类型：</strong>${getTypeName(msg.type)}</p><p><strong>状态：</strong>${msg.status === 'pending' ? '待回复' : '已回复'}</p><p><strong>时间：</strong>${formatTime(msg.createdAt)}</p></div><h4 style="margin-bottom:10px;">接收人</h4><div style="margin-bottom:20px; padding:15px; background:#f8f9fa; border-radius:8px;">${recipients.map(r => `${r.name} (${r.employeeId}) - ${r.department || r.region}`).join('<br>')}</div><h4 style="margin-bottom:10px;">沟通内容</h4><div style="margin-bottom:20px; padding:15px; background:#f8f9fa; border-radius:8px;">`;

      if (msg.senderRole === 'business') {
        html += `<p><strong>V1/V2客户：</strong>${msg.vip === 'no' ? '否' : msg.vip === 'v1' ? 'V1客户' : 'V2客户'}</p><p><strong>客户名称：</strong>${msg.customerName || '-'}</p><p><strong>样品短号：</strong>${msg.sampleCode || '-'}</p><p><strong>样品基质：</strong>${msg.sampleMatrix || '-'}</p><p><strong>样品数量：</strong>${msg.sampleCount || '-'}</p><p><strong>测试项目：</strong>${msg.testItems || '-'}</p><p><strong>到样日期：</strong>${msg.sampleDate || '-'}</p><p><strong>期望周期：</strong>${msg.requestedCycle || '-'}</p><p><strong>收取费用：</strong>${msg.chargeStatus || '-'}</p><p><strong>加急费用：</strong>${msg.urgentFee || '-'}</p><p><strong>备注：</strong>${msg.remark || '-'}</p>`;
      } else {
        html += `<p>${msg.content}</p>`;
      }

      html += `</div><h4 style="margin-bottom:10px;">回复记录</h4>${msg.replies?.length > 0 ? msg.replies.map(r => { const rs = getUserById(r.senderId); return `<div style="margin-bottom:10px; padding:12px; background:#f8f9fa; border-radius:8px;"><strong>${rs?.name || '未知'} (${rs?.employeeId || '-'})：</strong>${r.content}<div style="font-size:12px;color:#999;margin-top:5px;">${formatTime(r.createdAt)}</div></div>`; }).join('') : '<p style="color:#999;">暂无回复</p>'}<button class="btn btn-secondary" onclick="${currentUser.role === 'business' || currentUser.role === 'admin' ? 'showBusinessSend()' : 'showLabSend()'}" style="margin-top:20px;">返回</button></div>`;

      document.getElementById('pageContent').innerHTML = html;
    }

    function doLogout() {
      localStorage.removeItem('lab_current');
      currentUser = null;
      document.getElementById('pageMain').style.display = 'none';
      document.getElementById('pageLogin').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('modalReply').classList.remove('show');
      document.getElementById('modalDelete').classList.remove('show');
      currentUser = null;
      localStorage.removeItem('lab_current');
      initData();
    });
  </script>
</body>
</html>
