<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTI华测检测 - 实时实验室沟通系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #005BAC 0%, #0072CE 50%, #00A0E9 100%);
      min-height: 100vh;
    }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 45px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 480px;
    }
    .brand-area {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-logo {
      font-size: 28px;
      font-weight: 700;
      color: #005BAC;
      margin-bottom: 8px;
    }
    .brand-slogan {
      font-size: 14px;
      color: #666;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #eee;
      margin-bottom: 25px;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      border-radius: 6px;
      transition: all 0.3s;
    }
    .tab.active {
      background: white;
      color: #005BAC;
      box-shadow: 0 2px 8px rgba(0, 82, 156, 0.2);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #00A0E9;
      box-shadow: 0 0 0 3px rgba(0, 160, 233, 0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #005BAC 0%, #00A0E9 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 82, 156, 0.4);
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
      width: auto;
      padding: 8px 16px;
      font-size: 14px;
    }
    .error { color: #e53e3e; font-size: 12px; margin-top: 8px; text-align: center; }
    .success { color: #2f855a; font-size: 12px; margin-top: 8px; text-align: center; }
    .role-fields {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: none;
    }
    .role-fields.active { display: block; }

    .main-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #005BAC 0%, #003d6e 100%);
      color: white;
      padding: 25px 15px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-brand {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 20px;
    }
    .menu-item {
      padding: 12px 15px;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 5px;
      transition: all 0.3s;
      font-size: 14px;
    }
    .menu-item:hover, .menu-item.active {
      background: rgba(255,255,255,0.2);
    }
    .content {
      flex: 1;
      margin-left: 220px;
      padding: 25px;
      background: #f5f7fa;
    }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: white;
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .btn-logout {
      padding: 10px 20px;
      background: #fff;
      color: #e53e3e;
      border: 2px solid #e53e3e;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .card h3 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 18px; }
    .form-row.full { grid-template-columns: 1fr; }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      font-size: 14px;
      background: #f8f9fa;
    }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }

    .recipient-list {
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      max-height: 250px;
      overflow-y: auto;
      background: #fafafa;
    }
    .recipient-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    .recipient-item:last-child { border-bottom: none; }
    .recipient-item:hover { background: #f0f7ff; }
    .recipient-item input { margin-right: 12px; width: 18px; height: 18px; }
    .recipient-item .name { font-weight: 600; color: #333; }
    .recipient-item .dept { font-size: 12px; color: #888; margin-top: 3px; }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .table th, .table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .table th { background: #f8f9fa; font-weight: 600; color: #333; font-size: 14px; }
    .table tr:hover { background: #f8f9fa; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-paid { background: #fee2e2; color: #dc2626; }
    .badge-free { background: #dcfce7; color: #16a34a; }
    .badge-dispute { background: #fef3c7; color: #d97706; }
    .badge-follow { background: #d1fae5; color: #059669; }
    .badge-consult { background: #ede9fe; color: #7c3aed; }
    .badge-other { background: #f3f4f6; color: #4b5563; }

    .msg-item {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 4px solid #00A0E9;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .msg-sender { font-weight: 600; color: #333; font-size: 15px; }
    .msg-time { color: #999; font-size: 12px; }
    .msg-content { color: #555; margin-bottom: 12px; line-height: 1.6; }
    .msg-meta { font-size: 12px; color: #666; padding: 8px 12px; background: #f8f9fa; border-radius: 6px; margin-bottom: 12px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      min-height: 120px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }
    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 12px;
      width: auto;
      font-size: 13px;
    }
    .btn-small {
      padding: 6px 12px;
      width: auto;
      font-size: 13px;
    }
    .user-info {
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .user-info p {
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }
    .user-info strong {
      color: #333;
      display: inline-block;
      width: 70px;
    }
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .admin-tab {
      padding: 10px 20px;
      background: white;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .admin-tab.active {
      background: #005BAC;
      color: white;
      border-color: #005BAC;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    .stat-card .num {
      font-size: 32px;
      font-weight: 700;
      color: #005BAC;
    }
    .stat-card .label {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }
    .online-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .typing-indicator {
      color: #00A0E9;
      font-size: 12px;
      font-style: italic;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="pageLogin">
    <div class="login-wrap">
      <div class="login-box">
        <div class="brand-area">
          <div class="brand-logo">CTI华测检测</div>
          <div class="brand-slogan">实时实验室沟通系统</div>
        </div>
        <div class="tabs">
          <div class="tab active" onclick="showTab('login')">登录</div>
          <div class="tab" onclick="showTab('register')">注册</div>
        </div>
        <div id="formLogin">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="loginUser" placeholder="请输入用户名">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPass" placeholder="请输入密码">
          </div>
          <button class="btn" onclick="doLogin()">登 录</button>
          <div id="loginError" class="error"></div>
        </div>
        <div id="formRegister" style="display: none;">
          <div class="form-group">
            <label>用户角色</label>
            <select id="regRole" onchange="toggleRoleFields()">
              <option value="business">业务端</option>
              <option value="lab">实验室端</option>
            </select>
          </div>
          <div class="form-group">
            <label>姓名</label>
            <input type="text" id="regName" placeholder="请输入姓名">
          </div>
          <div class="form-group">
            <label>工号</label>
            <input type="text" id="regId" placeholder="请输入工号（唯一标识）">
          </div>
          <div class="form-group">
            <label>联系电话</label>
            <input type="tel" id="regPhone" placeholder="请输入联系电话">
          </div>
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="regEmail" placeholder="请输入邮箱">
          </div>
          <div id="fieldsBusiness" class="role-fields active">
            <div class="form-group">
              <label>所在地区</label>
              <input type="text" id="regRegion" placeholder="请输入所在地区">
            </div>
          </div>
          <div id="fieldsLab" class="role-fields">
            <div class="form-group">
              <label>所属部门</label>
              <input type="text" id="regDept" placeholder="请输入所属部门">
            </div>
            <div class="form-group">
              <label>联系优先级</label>
              <select id="regPriority">
                <option value="leader">组长</option>
                <option value="member">组员</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="regUser" placeholder="请设置用户名">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPass" placeholder="请设置密码">
          </div>
          <button class="btn" onclick="doRegister()">注 册</button>
          <div id="regError" class="error"></div>
          <div id="regSuccess" class="success"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="pageMain" style="display: none;">
    <div class="main-layout">
      <div class="sidebar">
        <div class="sidebar-brand">
          <h2>青岛华测实验室</h2>
          <p>实时沟通系统</p>
        </div>
        <div id="menuList"></div>
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
          <div style="font-size: 12px; opacity: 0.7; text-align: center;">
            <span class="online-indicator"></span>实时在线
          </div>
        </div>
      </div>
      <div class="content">
        <div class="content-header">
          <h1 id="pageTitle">发起沟通</h1>
          <div style="display: flex; align-items: center; gap: 15px;">
            <span id="currentUserInfo" style="color: #666; font-size: 14px;"></span>
            <button class="btn-logout" onclick="doLogout()">退出登录</button>
          </div>
        </div>
        <div id="pageContent"></div>
      </div>
    </div>
  </div>

  <div id="modalReply" class="modal-overlay">
    <div class="modal-content">
      <h3>回复消息</h3>
      <div id="replySender" class="user-info"></div>
      <div id="replyOriginal" style="margin-bottom: 15px;"></div>
      <textarea id="replyContent" placeholder="请输入回复内容..."></textarea>
      <button class="btn" onclick="sendReply()">发送回复</button>
      <button class="btn btn-secondary" onclick="closeReply()">取消</button>
    </div>
  </div>

  <div id="modalDelete" class="modal-overlay">
    <div class="modal-content">
      <h3>删除用户</h3>
      <p style="margin-bottom: 20px; color: #666;">确定要删除用户 <strong id="deleteUserName"></strong> 吗？此操作不可恢复！</p>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
      <button class="btn btn-secondary" onclick="closeDelete()">取消</button>
    </div>
  </div>

  <script>
    // ============================================
    // Supabase 配置 - 请替换为您的配置
    // ============================================
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY';
    
    let supabase = null;
    let currentUser = null;
    let replyTargetId = null;
    let deleteTargetId = null;
    let realtimeSubscription = null;

    // 初始化 Supabase
    function initSupabase() {
      if (SUPABASE_URL.includes('YOUR_PROJECT_ID')) {
        alert('请先配置 Supabase URL 和 Key！\n\n1. 访问 https://supabase.com 创建项目\n2. 在 Project Settings -> API 中获取 URL 和 anon key\n3. 修改代码中的 SUPABASE_URL 和 SUPABASE_KEY');
        return false;
      }
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return true;
    }

    // ============================================
    // 登录/注册功能
    // ============================================
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab')[tab === 'login' ? 0 : 1].classList.add('active');
      document.getElementById('formLogin').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('loginError').textContent = '';
      document.getElementById('regError').textContent = '';
      document.getElementById('regSuccess').textContent = '';
    }

    function toggleRoleFields() {
      const role = document.getElementById('regRole').value;
      document.getElementById('fieldsBusiness').classList.toggle('active', role === 'business');
      document.getElementById('fieldsLab').classList.toggle('active', role === 'lab');
    }

    async function doLogin() {
      if (!initSupabase()) return;
      
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      if (!username || !password) {
        document.getElementById('loginError').textContent = '请输入用户名和密码';
        return;
      }

      try {
        const { data: users, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username)
          .eq('password', password)
          .single();

        if (error || !users) {
          document.getElementById('loginError').textContent = '用户名或密码错误';
          return;
        }

        currentUser = users;
        localStorage.setItem('lab_current_user', JSON.stringify(users));
        showMain();
      } catch (err) {
        document.getElementById('loginError').textContent = '登录失败：' + err.message;
      }
    }

    async function doRegister() {
      if (!initSupabase()) return;

      const role = document.getElementById('regRole').value;
      const name = document.getElementById('regName').value;
      const empId = document.getElementById('regId').value;
      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const username = document.getElementById('regUser').value;
      const password = document.getElementById('regPass').value;

      if (!name || !empId || !username || !password) {
        document.getElementById('regError').textContent = '请填写必要信息';
        return;
      }

      try {
        // 检查用户名和工号是否已存在
        const { data: existing } = await supabase
          .from('users')
          .select('username, employee_id')
          .or(`username.eq.${username},employee_id.eq.${empId}`);

        if (existing && existing.length > 0) {
          document.getElementById('regError').textContent = '用户名或工号已存在';
          return;
        }

        const newUser = {
          name,
          employee_id: empId,
          username,
          password,
          role,
          phone,
          email
        };

        if (role === 'business') {
          newUser.region = document.getElementById('regRegion').value || '-';
        } else {
          newUser.department = document.getElementById('regDept').value || '-';
          newUser.priority = document.getElementById('regPriority').value;
        }

        const { error } = await supabase.from('users').insert([newUser]);
        if (error) throw error;

        document.getElementById('regSuccess').textContent = '注册成功，请登录';
        document.getElementById('regError').textContent = '';
        setTimeout(() => showTab('login'), 2000);
      } catch (err) {
        document.getElementById('regError').textContent = '注册失败：' + err.message;
      }
    }

    // ============================================
    // 主页面功能
    // ============================================
    function showMain() {
      document.getElementById('pageLogin').style.display = 'none';
      document.getElementById('pageMain').style.display = 'flex';
      document.getElementById('currentUserInfo').textContent = 
        `${currentUser.name} (${currentUser.employee_id})`;
      renderMenu();
      
      if (currentUser.role === 'admin') showAdmin();
      else if (currentUser.role === 'business') showBusinessSend();
      else showLabSend();

      // 启动实时订阅
      startRealtimeSubscription();
    }

    function renderMenu() {
      const menu = document.getElementById('menuList');
      let html = '';
      if (currentUser.role === 'admin') {
        html = '<div class="menu-item active" onclick="showAdmin()">用户管理</div>';
      } else if (currentUser.role === 'business') {
        html = '<div class="menu-item active" onclick="showBusinessSend()">发起沟通</div><div class="menu-item" onclick="showBusinessReceive()">收到的消息</div>';
      } else {
        html = '<div class="menu-item active" onclick="showLabSend()">发起沟通</div><div class="menu-item" onclick="showLabReceive()">收到的消息</div>';
      }
      menu.innerHTML = html;
    }

    // ============================================
    // 实时订阅功能
    // ============================================
    function startRealtimeSubscription() {
      if (!supabase) return;

      // 订阅 messages 表的变更
      realtimeSubscription = supabase
        .channel('messages')
        .on('postgres_changes', 
          { event: 'INSERT', schema: 'public', table: 'messages' },
          (payload) => {
            console.log('New message received:', payload.new);
            handleNewMessage(payload.new);
          }
        )
        .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'messages' },
          (payload) => {
            console.log('Message updated:', payload.new);
            handleMessageUpdate(payload.new);
          }
        )
        .subscribe();
    }

    function handleNewMessage(message) {
      // 检查是否是当前用户应该收到的消息
      if (message.recipients && message.recipients.includes(currentUser.id)) {
        showNotification('新消息', `收到来自 ${message.sender_name} 的消息`);
        // 如果在收件箱页面，刷新列表
        if (document.getElementById('pageTitle').textContent === '收到的消息') {

        } else {
          html = list.map(m => {
            const replyHtml = m.replies?.length > 0 ? `<div style="margin-top:12px; padding-top:12px; border-top:1px solid #eee;"><strong style="font-size:12px;color:#666;">回复记录:</strong>${m.replies.map(r => `<p style="margin-top:8px; padding-left:12px; border-left:3px solid #00A0E9; color:#555;">${r.sender_name || '未知'}：${r.content}</p>`).join('')}</div>` : '';
            return `<div class="msg-item" style="border-left-color:${tab === 'unread' ? '#e53e3e' : '#16a34a'};"><div class="msg-header"><span class="msg-sender">${m.sender_name || '未知'}</span><span class="msg-time">${formatTime(m.created_at)}</span></div><div class="msg-meta"><span class="badge badge-${getBadgeType(m.type)}">${getTypeName(m.type)}</span>${m.customer_name ? '客户: ' + m.customer_name : ''}${m.sample_code ? ' | 样品: ' + m.sample_code : ''}</div><div style="font-size:12px;color:#888;margin-bottom:12px;">${m.sample_matrix ? '基质: ' + m.sample_matrix + ' | ' : ''}${m.sample_count ? '数量: ' + m.sample_count + ' | ' : ''}${m.test_items ? '项目: ' + m.test_items : ''}</div><div class="msg-content">${m.content || '(表单沟通)'}</div>${replyHtml}<button class="btn btn-small" style="margin-top:12px;" onclick="openReply('${m.id}')">${tab === 'unread' ? '回复' : '查看详情'}</button></div>`;
          }).join('');
        }
        document.getElementById('labInboxContent').innerHTML = html;
      } catch (err) {
        console.error('加载消息失败:', err);
      }
    }

    // ============================================
    // 回复功能
    // ============================================
    async function openReply(msgId) {
      replyTargetId = msgId;
      try {
        const { data: msg } = await supabase.from('messages').select('*').eq('id', msgId).single();
        if (!msg) return;

        document.getElementById('replySender').innerHTML = `<p><strong>发送人:</strong> ${msg.sender_name || '未知'}</p><p><strong>类型:</strong> ${getTypeName(msg.type)}</p>`;
        document.getElementById('replyOriginal').innerHTML = `<strong style="display:block; margin-bottom:8px;">原消息：</strong><p style="padding:12px; background:#f8f9fa; border-radius:6px; color:#555;">${msg.content || '(表单沟通)'}</p>`;
        document.getElementById('replyContent').value = '';
        document.getElementById('modalReply').classList.add('show');
      } catch (err) {
        console.error('加载消息详情失败:', err);
      }
    }

    function closeReply() {
      document.getElementById('modalReply').classList.remove('show');
      replyTargetId = null;
    }

    async function sendReply() {
      const content = document.getElementById('replyContent').value;
      if (!content.trim()) {
        alert('请输入回复内容');
        return;
      }

      try {
        const { data: msg } = await supabase.from('messages').select('replies').eq('id', replyTargetId).single();
        const replies = msg.replies || [];
        replies.push({
          sender_id: currentUser.id,
          sender_name: currentUser.name,
          content,
          created_at: new Date().toISOString()
        });

        await supabase.from('messages').update({ replies, status: 'replied' }).eq('id', replyTargetId);
        closeReply();
        if (currentUser.role === 'business') showBusinessReceive();
        else showLabReceive();
      } catch (err) {
        alert('回复失败：' + err.message);
      }
    }

    // ============================================
    // 查看详情
    // ============================================
    async function viewDetail(msgId) {
      try {
        const { data: msg } = await supabase.from('messages').select('*').eq('id', msgId).single();
        if (!msg) return;

        let html = `<div class="card"><h3>沟通详情</h3>
          <div style="margin-bottom:20px;"><p><strong>发送人：</strong>${msg.sender_name || '未知'}</p>
          <p><strong>类型：</strong>${getTypeName(msg.type)}</p>
          <p><strong>状态：</strong>${msg.status === 'pending' ? '待回复' : '已回复'}</p>
          <p><strong>时间：</strong>${formatTime(msg.created_at)}</p></div>
          <h4 style="margin-bottom:10px;">接收人</h4>
          <div style="margin-bottom:20px; padding:15px; background:#f8f9fa; border-radius:8px;">${msg.recipient_names || '-'}</div>
          <h4 style="margin-bottom:10px;">沟通内容</h4>
          <div style="margin-bottom:20px; padding:15px; background:#f8f9fa; border-radius:8px;">`;

        if (msg.sender_role === 'business') {
          html += `<p><strong>V1/V2客户：</strong>${msg.vip === 'no' ? '否' : msg.vip === 'v1' ? 'V1客户' : 'V2客户'}</p>
          <p><strong>客户名称：</strong>${msg.customer_name || '-'}</p>
          <p><strong>样品短号：</strong>${msg.sample_code || '-'}</p>
          <p><strong>样品基质：</strong>${msg.sample_matrix || '-'}</p>
          <p><strong>样品数量：</strong>${msg.sample_count || '-'}</p>
          <p><strong>测试项目：</strong>${msg.test_items || '-'}</p>
          <p><strong>到样日期：</strong>${msg.sample_date || '-'}</p>
          <p><strong>期望周期：</strong>${msg.requested_cycle || '-'}</p>
          <p><strong>收取费用：</strong>${msg.charge_status || '-'}</p>
          <p><strong>加急费用：</strong>${msg.urgent_fee || '-'}</p>
          <p><strong>备注：</strong>${msg.remark || '-'}</p>`;
        } else {
          html += `<p>${msg.content}</p>`;
        }

        html += `</div><h4 style="margin-bottom:10px;">回复记录</h4>
          ${msg.replies?.length > 0 ? msg.replies.map(r => `<div style="margin-bottom:10px; padding:12px; background:#f8f9fa; border-radius:8px;"><strong>${r.sender_name || '未知'}：</strong>${r.content}<div style="font-size:12px;color:#999;margin-top:5px;">${formatTime(r.created_at)}</div></div>`).join('') : '<p style="color:#999;">暂无回复</p>'}
          <button class="btn btn-secondary" onclick="${currentUser.role === 'business' || currentUser.role === 'admin' ? 'showBusinessSend()' : 'showLabSend()'}" style="margin-top:20px;">返回</button></div>`;

        document.getElementById('pageContent').innerHTML = html;
      } catch (err) {
        console.error('加载详情失败:', err);
      }
    }

    // ============================================
    // 搜索功能
    // ============================================
    function filterRecipients(type) {
      const searchInput = type === 'lab' ? document.getElementById('labSearch') : document.getElementById('bizSearch');
      const containerId = type === 'lab' ? 'bRecipients' : 'lRecipients';
      const searchText = searchInput.value.toLowerCase();
      const container = document.getElementById(containerId);
      const items = container.querySelectorAll('.recipient-item');

      items.forEach(item => {
        const name = item.getAttribute('data-name').toLowerCase();
        const dept = item.getAttribute('data-dept').toLowerCase();
        const empId = item.getAttribute('data-empid').toLowerCase();
        item.style.display = (name.includes(searchText) || dept.includes(searchText) || empId.includes(searchText)) ? 'flex' : 'none';
      });
    }

    // ============================================
    // 辅助函数
    // ============================================
    function getTypeName(type) {
      const names = { paid_urgent: '付费加急', free_urgent: '免费加急', data_dispute: '数据质疑', follow_up: '跟单', consultation: '咨询', other: '其他', unqualified: '不合格沟通', data_confirm: '数据确认' };
      return names[type] || type;
    }

    function getBadgeType(type) {
      const types = { paid_urgent: 'paid', free_urgent: 'free', data_dispute: 'dispute', follow_up: 'follow', consultation: 'consult', other: 'other', unqualified: 'paid', data_confirm: 'follow' };
      return types[type] || 'other';
    }

    function formatTime(time) {
      if (!time) return '-';
      const d = new Date(time);
      return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function doLogout() {
      if (realtimeSubscription) {
        supabase.removeChannel(realtimeSubscription);
      }
      currentUser = null;
      localStorage.removeItem('lab_current_user');
      document.getElementById('pageMain').style.display = 'none';
      document.getElementById('pageLogin').style.display = 'block';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }

    // 页面加载时检查登录状态
    window.onload = function() {
      const savedUser = localStorage.getItem('lab_current_user');
      if (savedUser && initSupabase()) {
        currentUser = JSON.parse(savedUser);
        showMain();
      }
    };
  </script>
</body>
</html>
